name: Release

# Started by the tag that semantic-release.yml pushes after approval.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Upload Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CLEAN=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pipx install platformio

      # Both images must build; the report covers both, the .hex is the uno one.
      - name: Build firmware
        run: |
          set -o pipefail
          pio run -e uno -e uno_debug 2>&1 | tee build.log

      - name: Memory report
        run: python3 tools/memory_report.py build.log memory

      - name: Collect artifacts
        run: |
          cp .pio/build/uno/firmware.hex "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.hex"
          cp .pio/build/uno/firmware.elf "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.elf"
          cp memory/memory.json "OBDisplay-Uno-${{ env.VERSION_CLEAN }}-memory.json"

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            --method POST \
            -f tag_name="${{ env.VERSION }}" \
            --jq '.body' 2>/dev/null || echo "")

          {
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo ""
            fi
            cat <<ENDBUILDINFO
          ## OBDisplay-Uno ${{ env.VERSION }}

          ### Build info

          | | |
          |---|---|
          | Version | ${{ env.VERSION }} |
          | Commit | \`${SHA}\` |
          | Built | ${DATE} |
          | Target | Arduino Uno (ATmega328P, 16 MHz) |

          ENDBUILDINFO
            cat memory/memory.md
            cat <<ENDBUILDINFO

          ### Flashing

          Download \`OBDisplay-Uno-${{ env.VERSION_CLEAN }}.hex\` and flash with avrdude:

          \`\`\`bash
          avrdude -c arduino -p atmega328p -P /dev/ttyUSB0 -b 115200 \\
            -U flash:w:OBDisplay-Uno-${{ env.VERSION_CLEAN }}.hex:i
          \`\`\`

          Replace \`/dev/ttyUSB0\` with your port (\`COM3\` on Windows).

          The \`.elf\` file is a developer artifact (debug symbols, flash analysis). It cannot be flashed directly — use the \`.hex\` above.

          ENDBUILDINFO
          } > release-notes.md

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "${{ env.VERSION }}" \
            --notes-file release-notes.md \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.hex" \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.elf" \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}-memory.json" \
          || gh release upload "${{ env.VERSION }}" \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.hex" \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}.elf" \
            "OBDisplay-Uno-${{ env.VERSION_CLEAN }}-memory.json" \
            --clobber

      # README badges read these via shields.io endpoint badges. shields.io
      # cannot fetch github.com release downloads, so the files live on an
      # orphan 'badges' branch (raw.githubusercontent.com) that is replaced on
      # every release and never merged.
      - name: Publish memory badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd memory/badges
          git init -q -b badges
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Memory badges for ${{ env.VERSION }}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges
