; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env]
extra_scripts = pre:tools/inject_version.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
extra_scripts =
  pre:tools/inject_version.py
  post:tools/check_no_float.py
build_flags =
  -Wall -Wextra -Wpedantic -Wunused -Wshadow -Wformat=2
  -Wno-unused-parameter
  -fno-exceptions
  -fno-threadsafe-statics
  -Os
  -mcall-prologues
  -fno-inline-functions-called-once
  -flto
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -D OBD_EXPERIMENTAL_SCREENS

[env:uno_debug]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
extra_scripts = ${env:uno.extra_scripts}
build_flags =
  ${env:uno.build_flags}
  -D OBD_DEBUG
  -D OBD_EXPERIMENTAL_SCREENS

[env:native]
platform = native
build_flags =
  -Wall
  -Wextra
  -DNATIVE_BUILD
  -Inative_arduino
  -Wno-address-of-packed-member
test_build_src = yes
build_src_filter =
  +<obd/Model/*>
  +<obd/KWP/KWPSensorDecode.cpp>
  +<obd/Input/MenuState.cpp>
; Display.cpp drives the AVR TWI registers and the KWP session needs the AVR
; soft serial: those suites are AVR-only.
test_ignore =
  test_display_*
  test_kwp_receive

; Same tests as [env:native], but built with the production compiler flags for
; an ATmega328P and run under simavr: 16-bit int, avr-libc, real PROGMEM
; access. Catches overflow and pgm_read bugs the host build cannot see.
; Run with: pio test -e uno_sim
[env:uno_sim]
platform = atmelavr
board = uno
framework = arduino
platform_packages = platformio/tool-simavr
build_flags = ${env:uno.build_flags}
test_build_src = yes
build_src_filter =
  +<*>
  -<main.cpp>
; Nothing to flash: the ELF goes straight into the simulator.
upload_protocol = custom
upload_command = true
test_speed = 115200
; A hung firmware (endless loop, stack overflow) never reaches the end of the
; run, so the timeout turns it into a failed suite instead of a stuck CI job.
test_testing_command =
  timeout
  180
  ${platformio.packages_dir}/tool-simavr/bin/simavr
  -m
  atmega328p
  -f
  16000000L
  ${platformio.build_dir}/${this.__env__}/firmware.elf
